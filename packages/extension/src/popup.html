<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lokal</title>
<style>
:root{--red:#E5262E;--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--bg:#fff;--soft:#f9fafb;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--ink:#f3f4f6;--muted:#9ca3af;--line:#374151;--bg:#111827;--soft:#1f2937;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;width:340px;background:var(--bg);color:var(--ink);font:13px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
header img{width:26px;height:26px}
header h1{margin:0;font-size:17px;font-weight:700}
header p{margin:0;color:var(--muted);font-size:12px}
section{padding:12px 16px;border-bottom:1px solid var(--line)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.site{font-weight:600;word-break:break-all}
.hint{color:var(--muted);font-size:12px;margin:4px 0 0}
.stats{display:flex;gap:16px}
.stats b{display:block;font-size:22px;line-height:1.2}
.stats span{color:var(--muted);font-size:12px}
label.switch{position:relative;flex:none;width:36px;height:20px}
label.switch input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
label.switch span{position:absolute;inset:0;border-radius:999px;background:var(--line);transition:background .15s;pointer-events:none}
label.switch span::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s}
label.switch input:checked+span{background:var(--red)}
label.switch input:checked+span::after{transform:translateX(16px)}
label.switch input:focus-visible+span{outline:2px solid var(--red);outline-offset:2px}
textarea{width:100%;min-height:64px;resize:vertical;margin-top:6px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--soft);color:var(--ink);font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
button{font:inherit;border-radius:8px;padding:6px 12px;cursor:pointer;border:1px solid var(--line);background:var(--soft);color:var(--ink)}
button.primary{background:var(--red);border-color:var(--red);color:#fff}
button:disabled{opacity:.5;cursor:default}
.actions{display:flex;gap:8px;margin-top:8px}
footer{padding:10px 16px;color:var(--muted);font-size:12px}
footer a{color:inherit}
@media (prefers-reduced-motion:reduce){label.switch span,label.switch span::after{transition:none}}
</style>
</head>
<body>
<header>
  <img src="icons/48.png" alt="">
  <div><h1>Lokal</h1><p data-t="tagline"></p></div>
</header>
<section>
  <div class="row">
    <div><div class="site" id="site"></div><p class="hint" id="site-hint"></p></div>
    <label class="switch" id="switch"><input type="checkbox" id="enabled" role="switch"><span></span></label>
  </div>
</section>
<section class="stats">
  <div><b id="masked">0</b><span data-t="masked"></span></div>
  <div><b id="known">0</b><span data-t="known"></span></div>
</section>
<section>
  <label for="restore-in" data-t="restoreLabel"></label>
  <textarea id="restore-in"></textarea>
  <div class="actions"><button class="primary" id="restore" data-t="restore"></button></div>
</section>
<section>
  <p class="hint" data-t="clearHint" style="margin-top:0"></p>
  <div class="actions"><button id="clear" data-t="clear"></button></div>
</section>
<footer><span data-t="footer"></span> Â· <a href="https://github.com/lokal-id/lokal" target="_blank" rel="noreferrer">GitHub</a></footer>
<script src="popup.js"></script>
</body>
</html>
