[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "lokal-id"
version = "0.17.0"
description = "Indonesian data primitives for apps and AI agents: NIK, NPWP, phone numbers, Rupiah, terbilang, holidays, Kemendagri regions with postal codes, and Samaran PII masking (UU PDP)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "src/lokal/data/LICENSE-*.txt"]
authors = [{ name = "Lokal contributors" }]
keywords = [
  "indonesia", "nik", "npwp", "rupiah", "terbilang", "wilayah", "kode-pos", "hari-libur", "pii", "uu-pdp",
  "privacy", "llm", "masking",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Natural Language :: Indonesian",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
  "Topic :: Software Development :: Libraries",
  "Topic :: Text Processing",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
# lokal.samaran.ner: local NER models for names the rules do not know; not needed for anything else. Python 3.11 or
# later, as onnxruntime and PyTorch are. ner-lokal: Lokal's own model only (onnxruntime). ner: all three models,
# with transformers and PyTorch for "gold" and "fast".
ner-lokal = ["onnxruntime>=1.30; python_version >= '3.11'"]
ner = [
    "onnxruntime>=1.30; python_version >= '3.11'",
    "transformers>=4.46; python_version >= '3.11'",
    "torch>=2.4; python_version >= '3.11'",
    "safetensors>=0.4.5; python_version >= '3.11'",
    "huggingface-hub>=0.26; python_version >= '3.11'",
]

[project.urls]
Homepage = "https://github.com/lokal-id/lokal"
Documentation = "https://github.com/lokal-id/lokal/tree/main/python#readme"
Issues = "https://github.com/lokal-id/lokal/issues"
Changelog = "https://github.com/lokal-id/lokal/blob/main/CHANGELOG.md"

[dependency-groups]
dev = ["pytest>=8", "mypy>=1.11", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/lokal"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "scripts", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["error"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["UP007", "UP045", "SIM108", "SIM905"]

[tool.ruff.lint.per-file-ignores]
# Patterns are the TypeScript sources verbatim, so they stay on one line each.
"src/lokal/samaran/detectors.py" = ["E501"]
"src/lokal/samaran/fields.py" = ["E501"]
"tests/*" = ["E501", "B023"]

[tool.ruff.format]
quote-style = "single"

[tool.uv]
# Packages must be two weeks old before they are locked, so a compromised release has time to be caught.
exclude-newer = "2 weeks"
# filelock below 4.2.1 has local-user lock-file attacks (GHSA-v4x8-3wr5-3wq8 and others); 4.2.1 needs Python 3.11, as
# the NER extras that bring it in do. It was a few hours short of two weeks old when it was locked.
exclude-newer-package = { filelock = "2026-10-17T17:00:00Z" }
constraint-dependencies = ["filelock>=4.2.1; python_version >= '3.11'"]
