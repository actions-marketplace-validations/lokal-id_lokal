name: Release

# Push a tag like v0.2.3 to build @lokal-id/core and @lokal-id/mcp from that commit, test them,
# publish them to npm, then publish server.json to the official MCP Registry.
# No token is stored anywhere: npm uses Trusted Publishing (configured on npmjs.com for this
# repository, this workflow file, and the "npm" environment) and the MCP Registry uses GitHub OIDC,
# which grants the io.github.lokal-id/* namespace.
# Run it by hand (Actions > Release > Run workflow) to retry: anything already published is skipped.
#
# The build job installs dependencies and runs our code, but cannot publish: it has no id-token. The
# npm job can publish, but installs and runs nothing: it only uploads the tarballs the build job made.
# Dependencies come from package-lock.json (npm ci, checked against the registry's signatures) with
# install scripts turned off, and every action is pinned to a commit.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Versions match the tag
        run: node scripts/check-release.mjs ${{ github.ref_type == 'tag' && github.ref_name || '' }}
      - name: Install from the lockfile, without install scripts
        run: npm ci --ignore-scripts
      - name: Dependencies carry valid registry signatures
        run: npm audit signatures
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - name: Bundled hook is up to date
        run: git diff --exit-code -- hooks/samaran-guard.mjs
      - name: Python parity vectors are up to date
        run: node python/scripts/gen_vectors.mjs --check
      - name: The bundled MCP server works
        run: node scripts/smoke-mcp.mjs
      - name: Pack @lokal-id/core, @lokal-id/ner, and @lokal-id/mcp
        run: |
          mkdir tarballs
          npm pack --ignore-scripts --workspace @lokal-id/core --workspace @lokal-id/ner --workspace @lokal-id/mcp --pack-destination tarballs
          ls -l tarballs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-tarballs
          path: tarballs/*.tgz
          if-no-files-found: error
          retention-days: 7
      - name: Build the browser extension
        run: node scripts/build-extension.mjs
      # For the Chrome Web Store and the GitHub release; uploading to the store is done by hand.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-extension
          path: packages/extension/release/*.zip
          if-no-files-found: error
          retention-days: 30

  npm:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/@lokal-id/mcp
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: npm supports Trusted Publishing (11.5.1 or later)
        run: |
          npm --version
          node -e "const [a, b, c] = process.argv[1].split('.').map(Number); process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1)" "$(npm --version)"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-tarballs
          path: tarballs
      - name: Publish @lokal-id/core, then @lokal-id/ner and @lokal-id/mcp
        run: |
          for prefix in lokal-id-core lokal-id-ner lokal-id-mcp; do
            # ./ matters: npm reads tarballs/x.tgz as the GitHub repository tarballs/x.tgz.
            tarball=$(ls ./tarballs/$prefix-[0-9]*.tgz)
            name=$(tar -xOzf "$tarball" package/package.json | node -p "JSON.parse(require('fs').readFileSync(0)).name")
            version=$(tar -xOzf "$tarball" package/package.json | node -p "JSON.parse(require('fs').readFileSync(0)).version")
            if npm view "$name@$version" version > /dev/null 2>&1; then
              echo "$name@$version is already on npm, skipping"
            else
              npm publish "$tarball" --access public --ignore-scripts
            fi
          done

  mcp-registry:
    name: Publish to the MCP Registry
    needs: npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      PUBLISHER_VERSION: 1.8.1
      PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Versions match the tag
        run: node scripts/check-release.mjs ${{ github.ref_type == 'tag' && github.ref_name || '' }}
      - name: Install mcp-publisher
        run: |
          curl -fsSL -o mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/v$PUBLISHER_VERSION/mcp-publisher_linux_amd64.tar.gz"
          echo "$PUBLISHER_SHA256  mcp-publisher.tar.gz" | sha256sum --check
          tar xzf mcp-publisher.tar.gz mcp-publisher
      - name: Check whether this version is already in the registry
        id: existing
        run: |
          name=$(node -p "require('./server.json').name")
          version=$(node -p "require('./server.json').version")
          status=$(curl -s -o /dev/null -w '%{http_code}' "https://registry.modelcontextprotocol.io/v0/servers/${name/\//%2F}/versions/$version")
          if [ "$status" = 200 ]; then
            echo "$name $version is already in the MCP Registry, skipping"
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
      # The registry checks that the npm package declares mcpName, so wait until npm serves the new version.
      # Wait for @lokal-id/core as well: @lokal-id/mcp needs that exact version, and listing the server before
      # npm serves it would send clients to an install that fails. For 0.4.0, npm took 2 minutes to serve
      # @lokal-id/mcp and 11 minutes for @lokal-id/core, which is larger.
      - name: Wait for npm
        if: steps.existing.outputs.published != 'true'
        run: |
          version=$(node -p "require('./server.json').version")
          name=$(node -p "require('./server.json').name")
          for attempt in $(seq 1 180); do
            if [ "$(npm view "@lokal-id/mcp@$version" mcpName 2> /dev/null)" = "$name" ] \
              && [ "$(npm view "@lokal-id/core@$version" version 2> /dev/null)" = "$version" ]; then exit 0; fi
            sleep 10
          done
          echo "::error::@lokal-id/core@$version or @lokal-id/mcp@$version is not on npm after 30 minutes"
          exit 1
      - name: Validate server.json
        if: steps.existing.outputs.published != 'true'
        run: ./mcp-publisher validate
      - name: Log in with GitHub OIDC
        if: steps.existing.outputs.published != 'true'
        run: ./mcp-publisher login github-oidc
      - name: Publish server.json
        if: steps.existing.outputs.published != 'true'
        run: ./mcp-publisher publish
