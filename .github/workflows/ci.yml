name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - name: Bundled hook is up to date
        if: matrix.os == 'ubuntu-latest'
        run: git diff --exit-code -- hooks/samaran-guard.mjs
      - name: Python parity vectors are up to date
        if: matrix.os == 'ubuntu-latest'
        run: node python/scripts/gen_vectors.mjs --check
      - name: Release versions agree
        if: matrix.os == 'ubuntu-latest'
        run: node scripts/check-release.mjs

  python:
    name: Python ${{ matrix.python }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.14']
        include:
          - { os: ubuntu-latest, python: '3.11' }
          - { os: ubuntu-latest, python: '3.12' }
          - { os: ubuntu-latest, python: '3.13' }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Region data matches packages/core/data
        run: uv run python scripts/sync_data.py --check
      - run: uv run pytest
      - run: uv run mypy
      - run: uv run ruff check src tests scripts
      - name: The built wheel installs and works
        shell: bash
        run: |
          uv build
          uv venv --python ${{ matrix.python }} wheel-check
          uv pip install --python wheel-check dist/*.whl
          wheel-check/${{ runner.os == 'Windows' && 'Scripts/python.exe' || 'bin/python' }} -c \
            "import lokal; from lokal.wilayah import wilayah_name; assert wilayah_name('3276') == 'Kota Depok'; print(lokal.__version__)"
