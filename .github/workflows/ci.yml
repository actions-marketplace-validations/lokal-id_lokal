name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install from the lockfile, without install scripts
        run: npm ci --ignore-scripts
      - name: Dependencies carry valid registry signatures
        if: matrix.os == 'ubuntu-latest'
        run: npm audit signatures
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - name: The bundled MCP server works
        run: node scripts/smoke-mcp.mjs
      - name: Bundled hook is up to date
        if: matrix.os == 'ubuntu-latest'
        run: git diff --exit-code -- hooks/samaran-guard.mjs
      - name: Python parity vectors are up to date
        if: matrix.os == 'ubuntu-latest'
        run: node python/scripts/gen_vectors.mjs --check
      - name: Detection is not worse than the benchmark baseline
        if: matrix.os == 'ubuntu-latest'
        run: npm run bench
      - name: Release versions agree
        if: matrix.os == 'ubuntu-latest'
        run: node scripts/check-release.mjs
      - name: The browser extension builds
        if: matrix.os == 'ubuntu-latest'
        run: node scripts/build-extension.mjs

  python:
    name: Python ${{ matrix.python }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.14']
        include:
          - { os: ubuntu-latest, python: '3.11' }
          - { os: ubuntu-latest, python: '3.12' }
          - { os: ubuntu-latest, python: '3.13' }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install the test tools from uv.lock
        run: uv sync --locked
      - name: Region data matches packages/core/data
        run: uv run --locked python scripts/sync_data.py --check
      - name: Kembaran word lists match packages/core
        run: uv run --locked python scripts/sync_kembaran_data.py --check
      - run: uv run --locked pytest
      - run: uv run --locked mypy
      - run: uv run --locked ruff check src tests scripts
      - name: The built wheel installs and works
        shell: bash
        run: |
          uv build
          uv venv --python ${{ matrix.python }} wheel-check
          uv pip install --python wheel-check dist/*.whl
          wheel-check/${{ runner.os == 'Windows' && 'Scripts/python.exe' || 'bin/python' }} -c \
            "import lokal; from lokal.wilayah import wilayah_name; assert wilayah_name('3276') == 'Kota Depok'; print(lokal.__version__)"
